name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # Temporarily move API routes outside app (not supported in static export)
      - run: mv app/api .api-backup

      # Optional: set repo variable RADIO_STREAM_PROXY_URL to a deployed worker URL
      # (see stream-proxy-worker/) so HTTP-only streams work on HTTPS GitHub Pages.
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /radio-project
          NEXT_PUBLIC_STREAM_PROXY_URL: ${{ vars.RADIO_STREAM_PROXY_URL }}

      - run: mv .api-backup app/api

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
